name: Publish to npm

# Publishes via npm Trusted Publishing (OIDC). No NPM_TOKEN secret is stored:
# the registry verifies this workflow's identity directly, so the account can
# keep `Require 2FA for write actions` enabled.
#
# Release flow:
#   npm version <patch|minor|major>   # updates package.json and tags
#   git push && git push --tags

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC; without it the registry cannot verify us

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Only upgrade when the bundled
      # npm is older: an unconditional `npm@latest` fails EBADENGINE whenever
      # the newest npm outpaces the Node release we are running on.
      - name: Ensure npm supports trusted publishing
        run: |
          required=11.5.1
          current="$(npm --version)"
          oldest="$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)"
          if [ "$oldest" != "$required" ]; then
            echo "npm $current is older than $required, upgrading"
            npm install -g npm@latest
          fi
          npm --version

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Verify the installer works end to end
        run: |
          node bin/aether.js install --dry-run
          node bin/aether.js install
          node bin/aether.js verify
        env:
          CLAUDE_HOME: ${{ runner.temp }}/claude-home
          ENGINEERING_WORKFLOW_HOME: ${{ runner.temp }}/workflow-home

      - name: Publish
        run: npm publish --access public
